openapi: 3.0.3

info:
  title: "Validation Cloud Staking API"
  version: "1.0.0"

servers:
  - url: https://ethereum-staking.sprd.validationcloud.io

components:
  schemas:
    GetTokenRequest:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
          default: client_credentials
          enum:
            - client_credentials
        audience:
          type: string
          default: staking
          enum:
            - staking
    GetTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        scope:
          type: string
        expires_in:
          type: string
        token_type:
          type: string
    BroadcastTransactionRequest:
      type: object
      properties:
        signed_transaction:
          example: ""
          format: binary
          type: string
          description: |-
            The signed transaction in RLP canonical encoding that will be broadcasted to the Ethereum network.
    BroadcastTransactionResponse:
      type: object
      properties:
        transaction_hash:
          example: "0x9282185208634e55e0b8bfca0c63cc5dd9078f687cbff6c2dcd1222eafa04ca5"
          format: binary
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ValidatorKey:
      type: object
      properties:
        public_key:
          example: "0x134dea3b9a72b811ef33e63977c78ea11da9b5a7d8409384f9349739821d84af1a7988e4c30cd05db21410cdc5c020c90eaca75aaff6c50a5c0b06b411699008"
          format: binary
          type: string
      description: |-
        The public key of a validator.
    ExitValidatorsRequest:
      properties:
        validators:
          items:
            $ref: '#/components/schemas/ValidatorKey'
          type: array
        transaction_type:
          example: 2
          type: integer
          default: 0
          description: |
              Type of the returned transaction.
              0 for legacy transactions.
              2 for EIP-1559 transactions.
      required:
        - validators
      type: object
    Rewards:
      properties:
        all:
          example: 267626726
          type: integer
          description: |-
            The total amount of rewards earned by the validator.
        last_30_days:
          example: 120272088
          type: integer
          description: |-
            The amount of rewards earned by the validator in the last 30 days.
        last_365_days:
          example: 267626726
          type: integer
          description: |-
              The amount of rewards earned by the validator in the last 365 days.
      type: object
    StakeTransactionAPIRequest:
      properties:
        num_validators:
          example: 1
          type: integer
          description: |-
            The number of validators that will be created.
        wallet_address:
          example: 0x43a930733e3d493b42bb3ce70848e476c171371f5b
          format: binary
          type: string
          description: |-
              The address of the wallet that will be used to pay for the transaction. The deposit and exit transactions for the validators must be signed by this wallet. Make absolutely sure not to lose possession of it.
        transaction_type:
          example: 2
          type: integer
          default: 0
          description: |-
              Type of the returned transaction.
              0 for legacy transactions.
              2 for EIP-1559 transactions.
      type: object
    Transaction:
      type: object
      properties:
        data:
          example: ""
          format: binary
          type: string
          description: |-
            The data that will be sent to the contract.
        gas:
          example: 87936
          type: integer
          description: |-
            The amount of gas that will be used to execute the transaction.
        gas_price:
          example: "27"
          type: string
          description: |-
              The price of gas in Gwei.
        nonce:
          example: 35
          type: integer
          description: |-
              The nonce of the transaction. This is used to prevent replay attacks.
        to:
          example: "0x0ab8792f74261e83b1a3fe41c89017c359dcd52b"
          format: binary
          type: string
          description: |-
              The address of the contract that will be called.
        transaction_serialized:
          example: ""
          format: binary
          type: string
          description: |-
              The canonical RLP encoding of the transaction
        value:
          example: "32000000000000000000"
          type: string
          description: |-
              The amount of Ether that will be sent to the contract.
      description: |-
        The transaction that will need to be signed to be broadcasted to the Ethereum network.
    StakeTransactionAPIResponse:
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
        validator_keys:
          items:
            $ref: '#/components/schemas/ValidatorKey'
          type: array
      type: object
    Validator:
      type: object
      properties:
        created_at:
          example: "2023-07-21T20:33:24Z"
          type: string
          description:
            The date and time when the validator was created.
        index:
          example: 112948
          type: integer
          description: |-
              The index of the validator.
        public_key:
          example: "0x80002a239517f5034e51bccb897f783eb38147538b661e2c870c302cbefa48d86178a0f8ffdf75eb9f07e0afdfef3cd2"
          type: string
          description: |-
              The public key of the validator.
        rewards:
          $ref: '#/components/schemas/Rewards'
        status:
          example: "active_ongoing"
          type: string
          description: |-
              The status of the validator.
        withdrawal_address:
          example: "0x86008d099756bf129d332d0a923311e935ba936075"
          type: string
          description: |-
              The address where the rewards will be sent. Upon exiting, the initial deposit will also be withdrawn to this address.
    PresignedExitRequest:
      type: object
      required:
        - payload
        - signature
      properties:
        payload:
          type: string
          example: "{\"type\":\"presigned_exit_request\",\"timestamp\":\"2025-04-08T20:28:39.678Z\",\"validators\":[{\"public_key\":\"0xb31cb9c715b7a8a16ca7764f35b45883fce75699f25f90c44cae4e6a386d9f2c0dfd16303e1864cfbc0ae4dc194e872e\"}]}"
          description: |
            A JSON-encoded string containing the presigned exit request payload.
            Must include:
              - `type`: must be `"presigned_exit_request"`
              - `timestamp`: ISO8601 UTC timestamp
              - `validators`: array of validator public keys, all must share the same withdrawal address
        signature:
          type: string
          example: ""
          description: |
            ERC-191 signature of the payload string, signed by the withdrawal address of the specified validators.

    SignedExitMessage:
      type: array
      description: |
        A list of pre-signed voluntary exit messages that can be submitted to a beacon node to initiate validator exits.
      items:
        type: object
        properties:
          validator_key:
            type: string
            description: Public key of the validator
          exit_request:
            type: object
            description: A voluntary exit message
            properties:
              message:
                type: object
              signature:
                type: string
      example: [
        {
          "validator_key": "0xb31cb9c715b7a8a16ca7764f35b45883fce75699f25f90c44cae4e6a386d9f2c0dfd16303e1864cfbc0ae4dc194e872e",
          "exit_request": {
            "message": {
              "epoch": "5040",
              "validator_index": "1091615"
            },
            "signature": "0xb77505b425ff7486d5a4a08ab6bf85a9ac8d778b8609421683d36e7a3d10b3243b7b4d22490ff5620ea9d46ff4e4c13308ac689368852af4872e1cdb837ad2d2d170a407c22fa1981ec543e8b05b3cc7836b7f9d300d7796412023ff6b13f3aa"
          }
        }
      ]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /oauth/token:
    post:
      servers:
        - url: https://validationcloud.us.auth0.com
      description: Allows users to securely authenticate with API credentials through Auth0, and in return, provides a JSON Web Token (JWT) that can be used to access the rest of the API endpoints.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTokenRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/GetTokenResponse'
      tags:
        - Authentication

  /v1/api/ethereum/{network}/validators:
    get:
      description: Retrieves a list of validators established by the user.
      parameters:
        - name: network
          in: path
          required: true
          schema:
            type: string
            default: mainnet
            enum:
              - mainnet
              - hoodi
          description: The network
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Validator'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Staking
  /v1/api/ethereum/{network}/stake_transaction:
    post:
      description: Supplies a transaction that, once signed and broadcasted, facilitates
        the creation of stake validators.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakeTransactionAPIRequest'
      parameters:
        - name: network
          in: path
          required: true
          schema:
            type: string
            default: mainnet
            enum:
              - mainnet
              - hoodi
          description: The network
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeTransactionAPIResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Staking
  /v1/api/ethereum/{network}/broadcast_transaction:
    parameters:
      - name: network
        in: query
        required: true
        schema:
          type: string
          enum:
            - mainnet
            - hoodi
        description: The network
    post:
      description: Sends a signed deposit transaction to the Ethereum network, initiating
        validator creation. Both legacy and EIP-1559 transactions are supported.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastTransactionRequest'
      parameters:
        - name: network
          in: path
          required: true
          schema:
            type: string
            default: mainnet
            enum:
              - mainnet
              - hoodi
          description: The network
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastTransactionResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Staking
  /v1/api/ethereum/{network}/exit_validators:
    post:
      description: Provides a transaction, which after being signed and broadcasted,
        enables the specified validators to exit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExitValidatorsRequest'
      parameters:
        - name: network
          in: path
          required: true
          schema:
            type: string
            default: mainnet
            enum:
              - mainnet
              - hoodi
          description: The network
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Staking
  /v1/api/ethereum/{network}/presigned_exit_request:
    post:
      description: |
        Returns a pre-signed voluntary exit message that can be submitted to the Ethereum beacon chain
        at any time by any party. The signature must come from the withdrawal address associated with the 
        specified validators.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedExitRequest'
      parameters:
        - name: network
          in: path
          required: true
          schema:
            type: string
            default: mainnet
            enum:
              - mainnet
              - hoodi
          description: The Ethereum network.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedExitMessage'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Staking


security:
  - bearerAuth: []
